name: Rolling ECMWF versus GFS 10-day rainfall
on:
  push:
    branches: [main, feature/rolling-ifs-gfs-10day]
    paths:
      - rolling_ifs_gfs_rain.py
      - tests/test_rolling_rain.py
      - index.html
      - .github/workflows/ifs_gfs_rolling_10day.yml
  pull_request:
    paths:
      - rolling_ifs_gfs_rain.py
      - tests/test_rolling_rain.py
      - index.html
      - .github/workflows/ifs_gfs_rolling_10day.yml
  schedule:
    # Two model releases (00/12Z); each has an additional retry for lagging +240h.
    - cron: '40 7,19 * * *'
    - cron: '10 9,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rolling-ifs-gfs-10day-publication
  cancel-in-progress: false

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline requirements
        run: python -m pip install numpy
      - name: Test forecast windows, no double-count, and publication guards
        run: python -m unittest discover -s tests -p 'test_rolling_rain.py' -v

  generate:
    if: github.event_name != 'pull_request'
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 44
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ECMWF, NOAA GRIB and map dependencies
        run: python -m pip install numpy xarray cfgrib eccodes scipy matplotlib cartopy ecmwf-opendata
      - name: Verify real same-cycle NOAA GFS and ECMWF IFS; generate ten daily images
        run: python rolling_ifs_gfs_rain.py
      - name: Ensure all requested products were created or already published
        run: |
          test -s output/ECMWF_GFS_ROLLING_10DAY_STATUS.json
          test -s output/ECMWF_GFS_ROLLING_10DAY_TOTAL.png
          for d in $(seq -w 1 10); do
            test -s "output/ECMWF_GFS_ROLLING_10DAY_D${d}.png"
          done
      - name: Preview products on feature branch (never publish)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: IFS-GFS-rolling-10day-experiment
          path: |
            output/ECMWF_GFS_ROLLING_10DAY_D*.png
            output/ECMWF_GFS_ROLLING_10DAY_TOTAL.png
            output/ECMWF_GFS_ROLLING_10DAY_STATUS.json
          retention-days: 4
          if-no-files-found: error
      - name: Publish only rolling rain products on main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/ECMWF_GFS_ROLLING_10DAY_D*.png output/ECMWF_GFS_ROLLING_10DAY_TOTAL.png output/ECMWF_GFS_ROLLING_10DAY_STATUS.json
          if git diff --cached --quiet; then
            echo "No newer common model cycle; keeping the last published products."
            exit 0
          fi
          git commit -m "Update rolling ECMWF/GFS ten-day rainfall maps"
          git pull --rebase origin main
          git push origin HEAD:main
