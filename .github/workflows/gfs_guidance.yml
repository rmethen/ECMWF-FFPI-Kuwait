name: GFS guidance Kuwait

on:
  workflow_dispatch:
  schedule:
    - cron: "45 1,7,13,19 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy xarray cfgrib eccodes matplotlib cartopy
      - run: python gfs_guidance.py
      - name: Commit guidance image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/GFS_GUIDANCE_KUWAIT_LATEST.png
          git diff --cached --quiet || git commit -m "Update GFS guidance"
          git push
