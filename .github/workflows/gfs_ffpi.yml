name: GFS FFPI Kuwait

on:
  push:
    branches: [main]
    paths:
      - 'gfs_ffpi.py'
      - '.github/workflows/gfs_ffpi.yml'
  workflow_dispatch:
  schedule:
    - cron: "45 2,8,14,20 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy eccodes matplotlib cartopy
      - run: python gfs_ffpi.py
      - name: Commit GFS FFPI maps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/GFS_FFPI_KUWAIT_LATEST.png output/GFS_FFPI_MIDDLE_EAST_LATEST.png
          git diff --cached --quiet || git commit -m "Update GFS experimental FFPI maps"
          git pull --rebase origin main
          git push
