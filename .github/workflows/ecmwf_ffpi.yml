name: ECMWF FFPI Kuwait

on:
  workflow_dispatch:
  # ECMWF Open Data typically follows a 7-9h dissemination lag.
  # Try after release, then retry one hour later if the cycle is late.
  schedule:
    - cron: "47 3,4,9,10,15,16,21,22 * * *"

permissions:
  contents: write

jobs:
  update-map:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install numpy pandas xarray cfgrib eccodes matplotlib cartopy scipy requests ecmwf-opendata

      - name: Unit test cycle freshness
        run: python -m unittest discover -s tests -v

      - name: Run ECMWF FFPI
        run: python ecmwf_ffpi.py

      - name: Save updated map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Update ECMWF FFPI map"
          git push
