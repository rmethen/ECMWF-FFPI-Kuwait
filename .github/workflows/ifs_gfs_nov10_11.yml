name: ECMWF vs GFS Kuwait-Qaysumah Rain Comparison (10–11 Nov)
on:
  push:
    branches: [main, feature/ifs-gfs-qaysumah-rain-nov10-11]
    paths:
      - compare_ifs_gfs_nov10_11.py
      - tests/test_nov_rain_comparison.py
      - index.html
      - .github/workflows/ifs_gfs_nov10_11.yml
  pull_request:
    paths:
      - compare_ifs_gfs_nov10_11.py
      - tests/test_nov_rain_comparison.py
      - index.html
      - .github/workflows/ifs_gfs_nov10_11.yml
  schedule:
    # 00/12Z ECMWF cycles become available after dissemination;
    # 01, 07, 13 and 19 UTC attempts pick a complete common model run.
    - cron: '19 1,7,13,19 * * *'
  workflow_dispatch:

concurrency:
  group: ifs-gfs-precip-nov10-11
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install math dependencies
        run: python -m pip install numpy
      - name: Verify independent temporal windows and grids
        run: python -m unittest discover -s tests -p 'test_nov_rain_comparison.py' -v

  real-data-maps:
    if: github.event_name != 'pull_request'
    needs: offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real-data GRIB/cartography packages
        run: python -m pip install numpy xarray cfgrib eccodes scipy cartopy matplotlib ecmwf-opendata
      - name: Build IFS + GFS same-cycle 10/11 Nov UTC precipitation comparisons
        run: python compare_ifs_gfs_nov10_11.py
      - name: Upload experimental preview only
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ifs-gfs-qaysumah-nov10-11-preview
          path: |
            output/ECMWF_GFS_RAIN_QAYSUMAH_10NOV.png
            output/ECMWF_GFS_RAIN_QAYSUMAH_11NOV.png
            output/ECMWF_GFS_RAIN_QAYSUMAH_10_11NOV.png
            output/ECMWF_GFS_RAIN_QAYSUMAH_STATUS.json
          if-no-files-found: error
          retention-days: 5
      - name: Publish only the independent comparison files to GitHub Pages
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/ECMWF_GFS_RAIN_QAYSUMAH_10NOV.png output/ECMWF_GFS_RAIN_QAYSUMAH_11NOV.png output/ECMWF_GFS_RAIN_QAYSUMAH_10_11NOV.png output/ECMWF_GFS_RAIN_QAYSUMAH_STATUS.json
          if git diff --cached --quiet; then
            echo "No updated cycle for ECMWF/GFS comparison"
            exit 0
          fi
          git commit -m "Update ECMWF versus GFS rain maps for 10-11 November"
          git pull --rebase origin main
          git push origin HEAD:main
